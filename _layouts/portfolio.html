<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#101310">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Adam McMillan home">Adam McMillan<span>_</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/#work' | relative_url }}">Work</a><a href="{{ '/#background' | relative_url }}">Background</a><a href="{{ '/docs/cv_latest.pdf' | relative_url }}">CV <span aria-hidden="true">↗</span></a></nav>
      <a class="header-contact" href="mailto:adam.j.mcmillan@gmail.com">Say hello <span aria-hidden="true">↗</span></a>
    </header>
    <main id="main">{{ content }}</main>
    <footer><a class="wordmark" href="{{ '/' | relative_url }}">Adam McMillan<span>_</span></a><span>Melbourne, Australia</span><div><a href="https://github.com/ajmcm">GitHub ↗</a><a href="https://www.linkedin.com/in/ajmcm/">LinkedIn ↗</a><a href="mailto:adam.j.mcmillan@gmail.com">Email ↗</a></div></footer>
  </div>
</body>
</html>
